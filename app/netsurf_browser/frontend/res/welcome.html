<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NetSurf 浏览器</title>
<style>
body { margin: 0; padding: 24px 40px; font-family: sans-serif; color: #202124; background: #ffffff; }
h1 { font-size: 28px; margin: 8px 0 4px 0; }
p { font-size: 16px; color: #5f6368; margin: 4px 0 16px 0; }
ul { padding-left: 20px; }
li { font-size: 18px; margin: 10px 0; }
a { color: #1a73e8; text-decoration: none; }
.note { font-size: 14px; color: #80868b; margin-top: 24px; }
</style>
</head>
<body>
<h1>NetSurf 浏览器</h1>
<p>点击上方地址栏输入网址，手指拖动页面滚动，点击链接打开。</p>
<ul>
<li><a href="https://www.netsurf-browser.org/">NetSurf 官方网站</a></li>
<li><a href="https://lite.duckduckgo.com/lite/">DuckDuckGo Lite 搜索</a></li>
<li><a href="https://text.npr.org/">NPR 纯文本新闻</a></li>
<li><a href="http://info.cern.ch/">第一个网站 info.cern.ch</a></li>
</ul>
<p class="note">这是轻量浏览器：支持 HTML、CSS、PNG、基线 JPEG、GIF 和 BMP；不运行网页 JavaScript。HTTPS 需要 SD 卡上的 /sdcard/netsurf/ca-bundle.pem。</p>
</body>
</html>
