<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>文件管理 · 原生 LVGL</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f4f7;color:#292a34;font:14px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1136px;margin:32px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:21px;font-weight:550;margin:0}p,small{color:#85858e;line-height:1.7}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 16px}button,select{border:0;background:#e9e9ef;color:#757680;font:inherit;padding:9px 14px;border-radius:9px;cursor:pointer}button[aria-selected=true]{color:#292a34;background:#fff;box-shadow:0 1px 5px #00000009}select{margin-left:auto}figure{margin:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 28px #00000006}#frame{position:relative}img{width:100%;height:auto;display:block;aspect-ratio:1024/600}#statusTouch{position:absolute;left:0;right:0;top:0;height:5.333%;background:transparent;border-radius:0;padding:0}figcaption{padding:12px 18px;color:#8a8a94;font-size:12px}a{color:#737786}footer{margin-top:14px;display:flex;gap:20px;color:#898993;font-size:12px}@media(max-width:650px){main{padding:0 12px;margin:20px auto}header{display:block}nav{gap:6px}button,select{padding:8px 10px}select{margin-left:0}}</style>
<main><header><h1>文件管理</h1><small>原生 LVGL · 1024 × 600</small></header><p>紧凑三行网格，长文件名省略显示，格式单独保留；不支持的格式使用独立说明页。下方可切换原生界面截图，数据为离线测试示例。</p>
<nav id="nav"></nav><figure><div id="frame"><img id="screen" alt="原生 LVGL 预览"><button id="statusTouch" aria-label="查看快捷面板截图"></button></div><figcaption id="caption"></figcaption></figure><footer><span>截图浏览 · 离线示例数据 · 未连接设备</span><a href="README.txt">实现与验证</a></footer></main>
<script>
const pages=[['files-grid','全部文件'],['files-page2','文档与音频'],['files-page3','更多格式'],['files-single-page','单页'],['files-png','PNG 查看'],['files-heic','HEIC 提示'],['files-mov','MOV 播放器'],['files-details','文本详情'],['files-document','文档详情'],['files-rename','重命名'],['files-copy','复制与粘贴'],['files-delete','删除确认'],['files-sd','SD 卡']];let page='files-grid',theme='light';const nav=document.querySelector('#nav'),screen=document.querySelector('#screen'),caption=document.querySelector('#caption');
for(const [id,name]of pages){const b=document.createElement('button');b.textContent=name;b.dataset.page=id;b.onclick=()=>{page=id;draw()};nav.append(b)}const select=document.createElement('select');select.setAttribute('aria-label','主题');select.add(new Option('浅色','light'));select.add(new Option('深色','dark'));select.onchange=()=>{theme=select.value;draw()};nav.append(select);
function draw(){screen.src='ui/'+theme+'-'+page+'.png?v=20261015-boundaries8';document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.page===page)));caption.textContent=pages.find(r=>r[0]===page)[1]+' · 原生 LVGL 截图；文件操作与媒体数据为离线测试替身，不连接设备。';document.querySelector('#statusTouch').hidden=true}draw();</script></html>
