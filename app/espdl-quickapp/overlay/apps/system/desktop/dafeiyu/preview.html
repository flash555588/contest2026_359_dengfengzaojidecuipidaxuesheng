<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · 统一界面预览</title>
<style>
*{box-sizing:border-box}body{margin:24px;background:#e8e6ec;color:#292c38;font:14px "Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:16px;margin-bottom:16px}a{color:inherit}
main{display:flex;align-items:start;gap:24px;overflow:auto}#stage{position:relative;flex-shrink:0;overflow:hidden;border-radius:18px}
#stage>*{position:absolute;margin:0;overflow:hidden}button{cursor:pointer;font:inherit;border:0;white-space:nowrap;padding:0 8px}
button:active{filter:brightness(.93)}aside{min-width:220px;background:white;border-radius:18px;padding:20px}aside img{display:block;width:180px;margin:20px auto}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#303047;color:white;padding:12px 20px;border-radius:12px;z-index:10}
</style>
<header><strong>大肥鱼 · 浏览器预览</strong><a href="?theme=light">浅色</a><a href="?theme=dark">深色</a><span>与设备共用 app.js，交互使用本地状态</span></header>
<main><div id="stage"></div><aside>女仆装素材预览<img src="preview-assets/maid-front.png" alt="蓝发鲸鱼娘女仆装正面">设备通过 SD 资源包加载完整三视图。</aside></main><div id="toast" hidden></div>
<script>
const query=new URLSearchParams(location.search),light=query.get('theme')!=='dark';
const stage=document.getElementById('stage'),nodes=new Map();let nextId=1,toastTimer;
const previewSize={width:Math.max(640,Math.min(1400,Number(query.get('width'))||1024)),height:Math.max(400,Math.min(900,Number(query.get('height'))||504))};
stage.style.width=previewSize.width+'px';stage.style.height=previewSize.height+'px';
function hex(color){return '#'+Number(color).toString(16).padStart(6,'0');}
function node(tag,text,x,y,w,h,color){const el=document.createElement(tag);el.textContent=text;Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});el.style[tag==='div'?'background':'color']=hex(color);stage.appendChild(el);const id=nextId++;nodes.set(id,el);return id;}
globalThis.ui={primary:light?0x252d46:0xf4f2ff,getSize:()=>previewSize,isVisible:()=>!document.hidden,
 background:color=>stage.style.background=hex(color),
 text:(value,x,y,font,color)=>{const id=node('p',value,x,y,100,30,color);nodes.get(id).style.fontSize=font+'px';return id;},
 panel:(x,y,w,h,color)=>node('div','',x,y,w,h,color),
 button:(value,x,y,w,h,action,color)=>{const id=node('button',value,x,y,w,h,0);nodes.get(id).style.background=hex(color);nodes.get(id).onclick=action;return id;},
 setText:(id,value)=>nodes.get(id).textContent=value,
 setSize:(id,w,h)=>Object.assign(nodes.get(id).style,{width:w+'px',height:h+'px'}),
 setHidden:(id,hidden)=>nodes.get(id).hidden=hidden,
 setColor:(id,color)=>{const el=nodes.get(id);el.style[el.tagName==='P'?'color':'background']=hex(color);},
 setStyle:(id,style)=>{const el=nodes.get(id),s=el.style;
  if('radius'in style)s.borderRadius=style.radius+'px';if('borderWidth'in style)s.border=style.borderWidth+'px solid '+hex(style.borderColor||0);
  if('textColor'in style)s.color=hex(style.textColor);if('fontSize'in style)s.fontSize=style.fontSize+'px';
  if(style.rightAlign)s.textAlign='right';if(style.center)s.textAlign='center';
  if('ellipsis'in style){s.whiteSpace=style.ellipsis?'nowrap':'normal';s.textOverflow=style.ellipsis?'ellipsis':'clip';s.lineHeight=style.ellipsis?'1.1':'1.4';}}
};
globalThis.system={storage:{get:key=>localStorage.getItem(key),set:(key,value)=>localStorage.setItem(key,value)}};
const browserInput=window.prompt.bind(window);
globalThis.prompt={input:(options,done)=>done(browserInput(options.title,'')),showToast:text=>{const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,1800);}};
</script>
<script src="engine.js"></script><script src="app.js"></script>
</html>
