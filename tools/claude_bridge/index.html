<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESPClaw · 电脑 CLI</title>
<style>body{font:16px system-ui;background:#f5f4f0;color:#242520;max-width:920px;margin:40px auto;padding:0 20px}section{background:white;padding:24px;border-radius:18px;margin:18px 0}input,textarea,select{box-sizing:border-box;font:inherit;width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccc;border-radius:8px}button{font:inherit;padding:10px 18px;margin:4px;border:0;border-radius:8px;background:#314f45;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:460px;overflow:auto}small{color:#666}.danger{background:#a04747}</style>
<h1>ESPClaw · 电脑 CLI</h1><p>电脑执行，ESP 提交与监控。配对码见本机桥接服务的配置窗口或启动说明。</p>
<section id="pair"><label>配对码<input id="code" maxlength="6" inputmode="numeric"></label><button id="pairButton">连接</button></section>
<section id="work" hidden><label>CLI<select id="cli"></select></label><label>项目路径<input id="project"></label><label>任务内容<textarea id="prompt" rows="3"></textarea></label><button id="newButton">新任务</button><button id="followButton">继续当前会话</button><button class="danger" id="stopButton">停止</button><button id="refreshButton">刷新</button><select id="tasks" ></select><div id="keys" hidden><button data-key="up">Up</button><button data-key="down">Down</button><button data-key="enter">Enter</button><button data-key="escape">Esc</button></div><p id="status"></p><pre id="approval"></pre><div id="decision" hidden><button id="allowButton">允许本次操作</button><button class="danger" id="denyButton">拒绝</button></div><pre id="result"></pre><small id="events"></small></section><p id="error"></p>

<script src="/client.js" defer></script><script src="/app.js" defer></script></html>
